<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food">
  <title>Food planner</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn back" data-action="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Food planner</h1>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/plan" data-tab="plan">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </a>
    <a href="#/recipes" data-tab="recipes">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3v12H7.5a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5h11M9 8.5h6"/></svg>
      <span>Recipes</span>
    </a>
    <a href="#/shopping" data-tab="shopping">
      <svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 10.5h10.6L20.5 7H6.6"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
      <span>Shopping</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
